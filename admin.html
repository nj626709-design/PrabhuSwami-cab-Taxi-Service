<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrabhuSwami Gallery Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#171717}.wrap{max-width:1050px;margin:auto;padding:24px 16px}.panel{background:#fff;border-radius:16px;padding:24px;box-shadow:0 6px 24px #0000000d;margin:18px 0}.brand{color:#c18b00}.row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}input,button{font:inherit}input[type=email],input[type=password],input[type=file]{width:100%;padding:13px;border:1px solid #ddd;border-radius:8px;margin:8px 0 14px}button{border:0;border-radius:8px;background:#f5b400;color:#111;font-weight:700;padding:12px 18px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.secondary{background:#222;color:white}.danger{background:#c62828;color:white;width:100%}.status{min-height:24px;color:#555;overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}.item{border:1px solid #eee;border-radius:12px;overflow:hidden}.item img,.item video{display:block;width:100%;height:200px;object-fit:cover;background:#111}.item .meta{padding:12px}.filename{font-size:13px;overflow-wrap:anywhere;color:#555;margin:0 0 10px}.hidden{display:none!important}.hint{font-size:14px;color:#666;line-height:1.5}@media(max-width:600px){.panel{padding:18px}.wrap{padding:12px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="row"><div><h1 class="brand">PrabhuSwami</h1><p>Gallery Admin</p></div><a href="./index.html">View website</a></header>
  <section class="panel" id="loginPanel">
    <h2>Admin login</h2><p class="hint">Sign in with the admin account created in Supabase Authentication.</p>
    <form id="loginForm"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button id="loginButton" type="submit">Log in</button></form>
    <p class="status" id="loginStatus" role="status"></p>
  </section>
  <section class="panel hidden" id="dashboard">
    <div class="row"><div><h2>Manage photos & videos</h2><p class="hint">Select media from your phone or computer. Each file must be 50 MB or smaller.</p></div><button class="secondary" id="logoutButton">Log out</button></div>
    <input id="files" type="file" accept="image/*,video/*" multiple>
    <button id="uploadButton">Upload selected files</button><p class="status" id="uploadStatus" role="status"></p>
    <hr style="border:0;border-top:1px solid #eee;margin:24px 0">
    <div class="row"><h2>Current Gallery</h2><button class="secondary" id="refreshButton">Refresh</button></div>
    <div id="adminGallery" class="grid"><p>Loading...</p></div>
  </section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// Replace with your Supabase Project URL and publishable key. Never use a secret/service_role key here.
const SUPABASE_URL = "https://pcfdoaxduotsamwytxkq.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_N04ai3TFEcUrKL1kCg_11w_PNWVi3za";
const GALLERY_BUCKET = "Gallery";
const FOLDER = "Gallery";
const MAX_FILE_BYTES = 50 * 1024 * 1024;
const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
const $ = id => document.getElementById(id);
function configReady(){return !SUPABASE_URL.includes("YOUR_") && !SUPABASE_PUBLISHABLE_KEY.includes("YOUR_");}
function showLoggedIn(isIn){$("loginPanel").classList.toggle("hidden",isIn);$("dashboard").classList.toggle("hidden",!isIn);}
async function currentUser(){const {data:{user}}=await client.auth.getUser();return user;}
async function refreshGallery(){
  const host=$("adminGallery");host.replaceChildren();
  const {data,error}=await client.storage.from(GALLERY_BUCKET).list(FOLDER,{limit:100,sortBy:{column:"created_at",order:"desc"}});
  if(error){host.textContent="Could not load files: "+error.message;return;}
  const files=(data||[]).filter(f=>f.name&&f.name!==".emptyFolderPlaceholder");
  if(!files.length){host.textContent="No media uploaded yet.";return;}
  for(const file of files){
    const path=FOLDER+"/"+file.name;
    const {data:pub}=client.storage.from(GALLERY_BUCKET).getPublicUrl(path);
    const video=(file.metadata?.mimetype||"").startsWith("video/")||/\.(mp4|webm|mov|m4v)$/i.test(file.name);
    const card=document.createElement("article");card.className="item";
    const media=document.createElement(video?"video":"img");media.src=pub.publicUrl;
    if(video){media.controls=true;media.playsInline=true;media.preload="metadata";}else{media.alt=file.name;media.loading="lazy";}
    const meta=document.createElement("div");meta.className="meta";
    const name=document.createElement("p");name.className="filename";name.textContent=file.name;
    const del=document.createElement("button");del.className="danger";del.textContent="Delete";
    del.addEventListener("click",async()=>{if(!confirm("Delete this photo/video? This cannot be undone."))return;del.disabled=true;const {error}=await client.storage.from(GALLERY_BUCKET).remove([path]);if(error){alert("Delete failed: "+error.message);del.disabled=false;return;}await refreshGallery();});
    meta.append(name,del);card.append(media,meta);host.append(card);
  }
}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();if(!configReady()){ $("loginStatus").textContent="Add your Supabase Project URL and publishable key in this file first.";return; }$("loginButton").disabled=true;$("loginStatus").textContent="Signing in…";const {error}=await client.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});$("loginButton").disabled=false;if(error){$("loginStatus").textContent="Login failed: "+error.message;return;}$("loginStatus").textContent="";showLoggedIn(true);await refreshGallery();});
$("logoutButton").addEventListener("click",async()=>{await client.auth.signOut();showLoggedIn(false);});
$("refreshButton").addEventListener("click",refreshGallery);
$("uploadButton").addEventListener("click",async()=>{
  const files=[...$("files").files];if(!files.length){$("uploadStatus").textContent="Choose one or more photos/videos first.";return;}
  const tooLarge=files.find(f=>f.size>MAX_FILE_BYTES);if(tooLarge){$("uploadStatus").textContent=tooLarge.name+" is over 50 MB. Please compress it or choose a smaller file.";return;}
  $("uploadButton").disabled=true;let uploaded=0;const errors=[];
  for(const file of files){
    if(!file.type.startsWith("image/")&&!file.type.startsWith("video/")){errors.push(file.name+": unsupported file type");continue;}
    const safe=file.name.normalize("NFKD").replace(/[^a-zA-Z0-9._-]/g,"-");
    const path=FOLDER+"/"+Date.now()+"-"+Math.random().toString(36).slice(2,8)+"-"+safe;
    const {error}=await client.storage.from(GALLERY_BUCKET).upload(path,file,{cacheControl:"3600",upsert:false,contentType:file.type});
    if(error)errors.push(file.name+": "+error.message);else uploaded++;
  }
  $("files").value="";$("uploadButton").disabled=false;
  $("uploadStatus").textContent=uploaded+" file(s) uploaded."+(errors.length?" Issues: "+errors.join(" | "):"");
  await refreshGallery();
});
(async()=>{if(!configReady()){$("loginStatus").textContent="Setup required: add your Supabase Project URL and publishable key in admin.html.";return;}const user=await currentUser();showLoggedIn(!!user);if(user)await refreshGallery();})();
</script>
</body>
</html>
